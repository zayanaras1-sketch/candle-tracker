name: Build Candle Move Tracker APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto Organize Android Project
        run: |
          mkdir -p gradle/wrapper
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/
          [ -f libs.versions.toml ] && mv libs.versions.toml gradle/

          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f proguard-rules.pro ] && mv proguard-rules.pro app/

          for f in *.kt; do
            if [ -f "$f" ]; then
              pkg=$(grep -m 1 "^package " "$f" | sed -e 's/package //' -e 's/;//' -e 's/\r//' | tr '.' '/')
              mkdir -p "app/src/main/java/$pkg"
              mv "$f" "app/src/main/java/$pkg/"
            fi
          done

          for f in activity_*.xml overlay_*.xml item_*.xml; do
            [ -f "$f" ] && mv "$f" app/src/main/res/layout/
          done
          for f in bg_*.xml ic_*.xml; do
            [ -f "$f" ] && mv "$f" app/src/main/res/drawable/
          done
          for f in colors.xml strings.xml themes.xml; do
            [ -f "$f" ] && mv "$f" app/src/main/res/values/
          done
          for f in backup_rules.xml data_extraction_rules.xml; do
            [ -f "$f" ] && mv "$f" app/src/main/res/xml/
          done

          cat << 'EOF' > build.gradle.kts
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.android) apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
          }

          android {
              namespace = "com.candlemovetracker.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.candlemovetracker.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              implementation(libs.androidx.activity.ktx)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.lifecycle.service)
              implementation(libs.kotlinx.coroutines.android)
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google {
                      content {
                          includeGroupByRegex("com\\.android.*")
                          includeGroupByRegex("com\\.google.*")
                          includeGroupByRegex("androidx.*")
                      }
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CandleMoveTracker"
          include(":app")
          EOF

          chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CandleMoveTracker-App
          path: app/build/outputs/apk/debug/app-debug.apk
