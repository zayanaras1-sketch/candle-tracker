name: Build Candle Move Tracker APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Auto Organize Android Project
        shell: bash
        run: |
          set +e
          # 1. Folders
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # 2. Version catalog & wrapper
          if [ -f gradle-wrapper.properties ]; then mv -f gradle-wrapper.properties gradle/wrapper/; fi
          if [ -f libs.versions.toml ]; then mv -f libs.versions.toml gradle/; fi
          if [ -f AndroidManifest.xml ]; then mv -f AndroidManifest.xml app/src/main/; fi
          if [ -f proguard-rules.pro ]; then mv -f proguard-rules.pro app/; fi

          # 3. Kotlin files
          for f in *.kt; do
            if [ -f "$f" ]; then
              pkg=$(grep -m 1 "^package " "$f" | sed -e 's/package //' -e 's/;//' -e 's/\r//' | tr '.' '/')
              mkdir -p "app/src/main/java/$pkg"
              mv -f "$f" "app/src/main/java/$pkg/"
            fi
          done

          # 4. XML Resources
          for f in activity_*.xml overlay_*.xml item_*.xml; do
            if [ -f "$f" ]; then mv -f "$f" app/src/main/res/layout/; fi
          done
          for f in bg_*.xml ic_*.xml; do
            if [ -f "$f" ]; then mv -f "$f" app/src/main/res/drawable/; fi
          done
          for f in colors.xml strings.xml themes.xml; do
            if [ -f "$f" ]; then mv -f "$f" app/src/main/res/values/; fi
          done
          for f in backup_rules.xml data_extraction_rules.xml; do
            if [ -f "$f" ]; then mv -f "$f" app/src/main/res/xml/; fi
          done

          # 5. Build files
          cat << 'EOF' > build.gradle.kts
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.android) apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
          }

          android {
              namespace = "com.candlemovetracker.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.candlemovetracker.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              implementation(libs.androidx.activity.ktx)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.lifecycle.service)
              implementation(libs.kotlinx.coroutines.android)
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google {
                      content {
                          includeGroupByRegex("com\\.android.*")
                          includeGroupByRegex("com\\.google.*")
                          includeGroupByRegex("androidx.*")
                      }
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CandleMoveTracker"
          include(":app")
          EOF

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandleMoveTracker-App
          path: app/build/outputs/apk/debug/app-debug.apk
